<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b44a1e" />
    <meta
      name="description"
      content="Demo Sweet Shop — browse our menu of fresh sweets and snacks, build your order and send it on WhatsApp."
    />

    <!-- iOS standalone support: without these the app opens in a Safari frame
         even after "Add to Home Screen". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sweet Shop" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:title" content="Demo Sweet Shop" />
    <meta
      property="og:description"
      content="Fresh sweets and snacks. Build your order and send it on WhatsApp."
    />
    <meta property="og:type" content="website" />
    <!-- Social crawlers need an absolute image URL; a relative path is
         dropped when the share is rendered. Kept in sync with .deploy.env
         by scripts/deploy-config.sh. -->
    <meta
      property="og:image"
      content="https://nightforgeio.github.io/shop-template/assets/share.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Demo Sweet Shop — fresh sweets and snacks" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />
    <meta property="og:url" content="https://nightforgeio.github.io/shop-template/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Demo Sweet Shop" />
    <meta
      name="twitter:description"
      content="Fresh sweets and snacks. Build your order and send it on WhatsApp."
    />
    <meta
      name="twitter:image"
      content="https://nightforgeio.github.io/shop-template/assets/share.png"
    />
    <link rel="canonical" href="https://nightforgeio.github.io/shop-template/" />
    <!-- CSP: configure via HTTP header on your hosting server, not meta tag.
         Recommended: default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' -->
    <title>Demo Sweet Shop</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#viewMenu" data-i18n="menuTab">Menu</a>

    <!-- App header: title + live status + language -->
    <header class="app-header">
      <div class="app-header-row">
        <h1 class="shop-title" id="shopTitle" data-i18n="shopName">Demo Sweet Shop</h1>
        <button
          id="langToggle"
          class="lang-btn"
          data-lang-toggle
          type="button"
          aria-label="Switch language to Hindi"
          aria-pressed="false"
        >
          हिंदी
        </button>
      </div>
      <div class="app-header-sub">
        <span class="status-pill status-unknown" id="statusPill" hidden></span>
        <span class="header-sub-text" data-i18n="todaySpecial">Today's Special</span>
      </div>
    </header>

    <!-- Offline banner -->
    <div class="offline-banner" id="offlineBanner" role="status" hidden></div>

    <!-- ===== MENU VIEW ===== -->
    <section class="app-view" id="viewMenu" aria-labelledby="menuHeading">
      <h2 class="sr-only" id="menuHeading" data-view-heading data-i18n="menuTab">Menu</h2>

      <!-- Search -->
      <div class="search-wrap">
        <label class="sr-only" for="searchInput" data-i18n="searchLabel">Search the menu</label>
        <svg
          class="search-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search sweets, snacks"
          data-i18n-placeholder="searchPlaceholder"
          autocomplete="off"
          enterkeyhint="search"
        />
        <button
          type="button"
          class="search-clear"
          id="searchClear"
          aria-label="Clear search"
          data-i18n-aria="clearSearch"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M6 6l12 12M18 6L6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <!-- Category filters -->
      <nav
        class="filter-bar"
        id="filterBar"
        aria-label="Filter by category"
        data-i18n-aria="filterNavLabel"
      >
        <button
          class="filter-btn active"
          type="button"
          data-filter="all"
          aria-pressed="true"
          data-i18n="filterAll"
        >
          All
        </button>
        <button
          class="filter-btn"
          type="button"
          data-filter="sweet"
          aria-pressed="false"
          data-i18n="filterSweet"
        >
          Sweets
        </button>
        <button
          class="filter-btn"
          type="button"
          data-filter="snack"
          aria-pressed="false"
          data-i18n="filterSnack"
        >
          Snacks
        </button>
      </nav>

      <!-- Today's special -->
      <section class="special-banner" id="specialBanner" hidden>
        <span class="special-badge" data-i18n="todaySpecial">Today's Special</span>
        <span class="special-name" id="specialName"></span>
      </section>

      <!-- Item grid -->
      <main class="menu-grid" id="menuGrid" aria-live="polite" aria-busy="true">
        <noscript>
          <p class="noscript-msg">
            This menu requires JavaScript to display items. Please enable JavaScript or contact the
            shop directly.
          </p>
        </noscript>
      </main>
    </section>

    <!-- ===== CART VIEW ===== -->
    <section class="app-view" id="viewCart" aria-labelledby="cartHeading" hidden>
      <h2 class="view-title" id="cartHeading" data-view-heading data-i18n="yourCart">Your cart</h2>
      <div class="cart-list" id="cartList"></div>
      <div class="cart-summary">
        <div class="cart-summary-row">
          <span class="cart-summary-label" data-i18n="itemsLabel">items</span>
          <span class="cart-summary-count" id="cartCount">0 items</span>
        </div>
        <div class="cart-summary-row cart-summary-total">
          <span class="cart-summary-label" data-i18n="total">Total</span>
          <span class="cart-summary-value" id="cartTotal">₹0</span>
        </div>
        <button
          type="button"
          class="btn-primary btn-block"
          id="btnOrder"
          data-i18n="orderOnWhatsapp"
        >
          Send order on WhatsApp
        </button>
        <p class="cart-note" data-i18n="orderNote">
          Opens WhatsApp with your order written out. We never take payment here.
        </p>
      </div>
    </section>

    <!-- ===== VISIT VIEW ===== -->
    <section class="app-view" id="viewVisit" aria-labelledby="visitHeading" hidden>
      <h2 class="view-title" id="visitHeading" data-view-heading data-i18n="visitTitle">
        Visit us
      </h2>
      <div id="visitBody"></div>
    </section>

    <!-- ===== MORE VIEW ===== -->
    <section class="app-view" id="viewMore" aria-labelledby="moreHeading" hidden>
      <h2 class="view-title" id="moreHeading" data-view-heading data-i18n="moreTab">More</h2>
      <div id="moreBody"></div>
      <div class="more-actions">
        <button
          type="button"
          class="btn-outline btn-block"
          id="btnInstall"
          hidden
          data-i18n="installApp"
        >
          Install the app
        </button>
        <p class="install-hint" data-i18n="installHint">
          Add it to your home screen for a full-screen, faster experience.
        </p>
        <button type="button" class="btn-outline btn-block" id="btnShare" data-i18n="shareShop">
          Share
        </button>
        <p class="footer-meta">
          <span data-i18n="menuUpdated">Menu updated</span>:
          <time id="lastUpdated"></time>
        </p>
      </div>
    </section>

    <!-- ===== BOTTOM TAB BAR ===== -->
    <nav class="tabbar" id="tabbar" aria-label="Main" data-i18n-aria="mainNavLabel">
      <button class="tab active" type="button" data-view="menu" aria-current="page">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M4 6h16M4 12h16M4 18h10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <span data-i18n="menuTab">Menu</span>
      </button>
      <button class="tab" type="button" data-view="cart">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M3 4h2l2.5 11h10L20 7H6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="10" cy="19" r="1.6" fill="currentColor" />
          <circle cx="17" cy="19" r="1.6" fill="currentColor" />
        </svg>
        <span data-i18n="cartTab">Cart</span>
        <span class="cart-badge" id="cartBadge" hidden>0</span>
      </button>
      <button class="tab" type="button" data-view="visit">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2" />
        </svg>
        <span data-i18n="visitTab">Visit</span>
      </button>
      <button class="tab" type="button" data-view="more">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="5" cy="12" r="1.6" fill="currentColor" />
          <circle cx="12" cy="12" r="1.6" fill="currentColor" />
          <circle cx="19" cy="12" r="1.6" fill="currentColor" />
        </svg>
        <span data-i18n="moreTab">More</span>
      </button>
    </nav>

    <!-- ===== ITEM DETAIL SHEET ===== -->
    <div
      class="sheet-backdrop"
      id="itemSheet"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Item details"
      data-i18n-aria="itemDetails"
    >
      <div class="sheet-close-bar">
        <button
          type="button"
          class="sheet-close"
          data-sheet-close
          aria-label="Close"
          data-i18n-aria="close"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M6 6l12 12M18 6L6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="js/i18n.js"></script>
    <script src="js/hours.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
